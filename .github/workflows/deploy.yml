name: Deploy all versions to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare all site versions
        run: |
          mkdir -p site

          # Copie tous les fichiers HTML présents à la racine
          find . -maxdepth 1 -type f -name "index*.html" -exec cp {} site/ \;

          # Copie tous les CSS et JavaScript
          find . -maxdepth 1 -type f -name "*.css" -exec cp {} site/ \;
          find . -maxdepth 1 -type f -name "*.js" -exec cp {} site/ \;

          # Copie les images, si tu en as
          if [ -d "images" ]; then
            cp -r images site/images
          fi

          # Liste les fichiers publiés pour vérifier dans les logs
          ls -la site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        